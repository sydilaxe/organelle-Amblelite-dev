# Build, test in Pure Data, and package the patch.
#  - every push and pull request: build, check the committed patch matches its source, run the checks, package
#  - push a tag like v0.3 -> a GitHub Release with the zip attached
#  - Actions > "Build" > Run workflow (version e.g. v0.3) -> the same ("dev" makes a pre-release, replaced each time)
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v0.3"
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Pure Data and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends puredata-core python3-numpy zip
          pd -version

      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="${{ inputs.version || 'dev' }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: tools/build.sh

      - name: Committed patch matches its source
        run: |
          if [ -n "$(git status --porcelain -- patches/)" ]; then
            git status --short -- patches/
            echo "::error::patches/ is out of date - run tools/build.sh and commit the result"
            exit 1
          fi

      - name: Test in Pure Data
        working-directory: tools
        run: python3 check.py

      - name: Package
        run: tools/package.sh "${{ steps.v.outputs.version }}"

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          printf '## Install\nUnzip and copy the "AmbleLite" folder into the Organelle Patches folder.\nHow to play: AmbleLite/README.txt.\n' > notes.md
          pre=""
          if [ "$v" = "dev" ]; then
            pre="--prerelease"
            gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          elif [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "$v" >/dev/null 2>&1; then
            echo "::error::Release $v already exists - choose a new version"
            exit 1
          fi
          gh release create "$v" dist/*.zip --target "$GITHUB_SHA" --title "Amble Lite $v" --notes-file notes.md \
            --generate-notes $pre
